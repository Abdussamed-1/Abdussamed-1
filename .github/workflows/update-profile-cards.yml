name: Update Profile Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&bg_color=0d1117&title_color=00ffcc&icon_color=00ff41&text_color=e6edf3&border_radius=14&disable_animations=true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: >-
            username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&bg_color=0d1117&title_color=00ffcc&text_color=e6edf3&langs_count=6&border_radius=14&disable_animations=true&hide=Jupyter%20Notebook

      - name: Activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: profile/activity-graph.svg
          options: >-
            bg_color=0d1117&color=9fb0c3&line=00ffcc&point=00ff41&area=true&area_color=00ffcc&hide_border=true&radius=14&custom_title=Contribution%20Activity&title_color=00ffcc

      - name: Streak card
        continue-on-error: true
        run: |
          curl -fsSL \
            "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&hide_border=true&border_radius=14&background=0D1117&stroke=30363d&ring=00ffcc&fire=00ff41&currStreakNum=e6edf3&sideNums=e6edf3&currStreakLabel=9fb0c3&sideLabels=9fb0c3&dates=9fb0c3" \
            -o profile/streak.svg
          head -c 200 profile/streak.svg | grep -qi '<svg' || git checkout -- profile/streak.svg 2>/dev/null || true

      - name: Fix SVG + render compact PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

          # Camo freezes animations → unhide staggered text
          sed -i -E 's/opacity:\s*0;/opacity: 1;/g' profile/*.svg
          sed -i -E 's/\.stagger\s*\{[^}]*\}/.stagger { opacity: 1; }/g' profile/*.svg
          sed -i -E "s/ style='[^']*animation:[^']*'//g" profile/*.svg

          # github-stats-extended bug: values lack text-anchor="end" → overlap labels
          sed -i -E 's/x="224\.01"/x="300" text-anchor="end"/g' profile/github-stats.svg

          # Compact PNG sizes (README display stays small & sharp)
          rsvg-convert -w 420 profile/github-stats.svg -o profile/github-stats.png
          rsvg-convert -w 300 profile/top-langs.svg -o profile/top-langs.png
          rsvg-convert -w 480 profile/streak.svg -o profile/streak.png
          rsvg-convert -w 780 profile/activity-graph.svg -o profile/activity-graph.png
          rm -f profile/*.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git push
