name: Generate GitHub Metrics

on:
  schedule:
    # Her gün 03:00 UTC'de otomatik yeniden üretir
    - cron: "0 3 * * *"
  workflow_dispatch: {} # Actions sekmesinden manuel de tetikleyebilirsin
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          committer_message: "chore: update github-metrics.svg [skip ci]"

          # --- Görünüm / tema ---
          config_timezone: Europe/Istanbul
          plugin_base: header, activity, community, repositories, metadata
          base: header, activity, community, repositories
          config_display: large
          config_theme: dark

          # --- Aktif eklentiler ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 10
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14
          plugin_languages_threshold: O%

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%

          plugin_lines: yes
          plugin_lines_history_limit: 28
          plugin_lines_repositories_limit: 3

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          plugin_calendar: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year